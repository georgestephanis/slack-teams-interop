services:
  interbridge:
    build: .
    container_name: interbridge
    restart: unless-stopped
    ports:
      - "3978:3978"
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      # 127.0.0.1, not localhost: in the Alpine image localhost resolves to ::1, but the app listens on IPv4 (0.0.0.0)
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3978/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
